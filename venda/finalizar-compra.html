<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprovante Oficial 6ª FPSS - Festa do Padroeiro São Sebastião</title>

  <style>
    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#8b1111,#ff1f1f);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      background:#fff;
      max-width:750px;
      width:100%;
      border-radius:18px;
      padding:25px;
      box-shadow:0 15px 40px rgba(0,0,0,0.3);
      text-align:center;
      border-top:6px solid #8b1111;
    }

    h1{color:#8b1111;margin-bottom:10px;}
    .sub{color:#555;margin-bottom:20px;}

    .valor{
      font-size:42px;
      font-weight:bold;
      color:#1d7f2a;
      margin:15px 0;
    }

    .box{
      background:#f5f5f5;
      padding:14px;
      border-radius:12px;
      margin:12px 0;
      text-align:left;
      word-break:break-word;
    }

    .titulo{
      font-weight:bold;
      display:block;
      margin-bottom:6px;
    }

    textarea{
      width:100%;
      height:120px;
      padding:12px;
      border-radius:8px;
      border:1px solid #ccc;
      resize:none;
      font-size:14px;
    }

    button{
      width:100%;
      border:none;
      padding:16px;
      font-size:17px;
      font-weight:bold;
      border-radius:12px;
      cursor:pointer;
      margin-top:10px;
      color:white;
    }

    .btn-pix{
      background:linear-gradient(135deg,#1d7f2a,#28a745);
    }

    .btn-comprovante{
      background:linear-gradient(135deg,#8b1111,#c1121f);
    }

    .qr-grid{
      display:grid;
      grid-template-columns:1fr;
      gap:20px;
      margin-top:20px;
    }

    .qr-card{
      background:#fafafa;
      border-radius:12px;
      padding:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .qr-box{
      display:flex;
      justify-content:center;
      margin-top:10px;
    }

    .alerta{
      margin-top:20px;
      background:#fff3cd;
      color:#856404;
      padding:14px;
      border-radius:10px;
      font-size:14px;
      line-height:1.5;
    }

    .hidden{
      display:none;
    }

    @media print{
      body{
        background:white;
        padding:0;
      }

      .container{
        box-shadow:none;
        border:none;
        max-width:100%;
        padding:10px;
      }

      .no-print{
        display:none !important;
      }

      .valor{
        font-size:28px;
      }

      textarea{
        display:none;
      }

      button{
        display:none;
      }

      .alerta{
        font-size:12px;
      }

      .qr-grid{
        grid-template-columns:1fr;
      }

      @page{
        size:A4;
        margin:10mm;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <h1>✅ Pedido Gerado com Sucesso!</h1>
  <p class="sub">6ª Festa do Padroeiro São Sebastião</p>

  <div id="statusPagamento" class="box" style="text-align:center;background:#fff3cd;color:#856404;font-weight:bold;">
    ⏳ Aguardando confirmação do pagamento...
  </div>

  <div id="conteudo"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const dados = JSON.parse(localStorage.getItem("pixData"));

function mascararCPF(cpf){
  if(!cpf) return "CPF não informado";

  cpf = String(cpf).replace(/\D/g,"");

  if(cpf.length !== 11) return cpf;

  return `***.${cpf.slice(3,6)}.***-**`;
}

function valorPedido(){
  return Number(
    dados.total ||
    dados.valor ||
    dados.valor_total ||
    0
  );
}

function copiarPix(){
  const pix = document.getElementById("pixCode");
  if(!pix) return;

  pix.select();
  pix.setSelectionRange(0,99999);
  document.execCommand("copy");

  alert("✅ Código PIX copiado!");
}

/* =========================================
   TELA PENDENTE
========================================= */
function renderPendente(){

  const codigoPix = dados.qr_code || dados.pix_copia_cola || "";

  document.getElementById("conteudo").innerHTML = `
   <div style="
  font-size:38px;
  font-weight:900;
  color:#1b4332;
  background:#e9f5ff;
  padding:10px;
  border-radius:10px;
  margin:15px 0;
">
  💰 R$ ${valorPedido().toFixed(2).replace(".", ",")}
</div>

    <div class="box">
      <span class="titulo">🎟️ Código Oficial do Pedido:</span>
      ${dados.codigo_pedido || "Não disponível"}
    </div>

    <h3>📱 PIX Copia e Cola:</h3>

    <textarea id="pixCode" readonly>${codigoPix}</textarea>

    <button class="btn-pix no-print" onclick="copiarPix()">
      📋 COPIAR CÓDIGO PIX
    </button>

    <div class="qr-grid">
      <div class="qr-card">
        <h3>💳 QR Code Pagamento</h3>
        <div id="qrcodePagamento" class="qr-box"></div>
      </div>
    </div>

    <div class="alerta">
      ⚠️ Realize o pagamento para liberar retirada e comprovante oficial.
    </div>
  `;

  if(codigoPix){
    new QRCode(document.getElementById("qrcodePagamento"),{
      text:codigoPix,
      width:220,
      height:220,
      correctLevel:QRCode.CorrectLevel.H
    });
  }
}

/* =========================================
   TELA PAGA
========================================= */
function renderPago(){

  document.getElementById("conteudo").innerHTML = `
    <div style="border:3px solid #8b1111;border-radius:18px;padding:20px;background:#fffaf8;">

      <div style="text-align:center;border-bottom:2px dashed #c1121f;padding-bottom:15px;margin-bottom:20px;">
        <h2 style="margin:0;color:#8b1111;">🍖 6ª Festa do Padroeiro São Sebastião</h2>
        <p style="margin:8px 0 0;color:#555;font-weight:bold;">
          📅 24 de Janeiro de 2027 • 🎟️ Comprovante Oficial FPSS
        </p>
      </div>

      <div style="
        background:#d4edda;
        color:#155724;
        font-size:22px;
        font-weight:900;
        padding:14px;
        border-radius:12px;
        margin-bottom:20px;
        text-align:center;
      ">
        ✅ PAGAMENTO CONFIRMADO
      </div>

      <div class="valor">R$ ${valorPedido().toFixed(2).replace(".", ",")}</div>

      <div class="box">
        <span class="titulo">🎟️ Código Oficial do Pedido:</span>
        ${dados.codigo_pedido}
      </div>

      <div class="box">
        <span class="titulo">👤 CPF para validação:</span>
        ${mascararCPF(dados.cpf)}
      </div>

      <div class="box">
        <span class="titulo">🔐 Token Oficial de Retirada:</span>
        <span style="
          display:block;
          font-size:24px;
          font-weight:900;
          color:#8b1111;
          margin-top:8px;
          text-align:center;
          letter-spacing:1px;
        ">
          ${dados.token_retirada}
        </span>
      </div>

      <div class="box">
        <span class="titulo">⏰ Retirada:</span>
        24/01/2027 • Apresente este comprovante entre 10h e 15h
      </div>

      <button class="btn-comprovante no-print" onclick="window.print()">
        🧾 IMPRIMIR / SALVAR PDF
      </button>

      <div class="qr-grid">
        <div class="qr-card" style="border:2px solid #8b1111;">
          <h3 style="margin-bottom:10px;">🍖 QR Code Oficial de Retirada</h3>
          <div id="qrcodeRetirada" class="qr-box"></div>
        </div>
      </div>

      <div class="alerta" style="background:#e9f5ff;color:#003049;">
        ✅ Documento oficial de retirada aprovado.<br><br>
        📌 Apresente:
        <strong>QR Code + CPF</strong><br>
        🔒 Não compartilhe seu token com terceiros.
      </div>

      <div style="
        margin-top:20px;
        padding-top:15px;
        border-top:1px dashed #999;
        text-align:center;
        font-size:12px;
        color:#666;
      ">
        FPSS 2027 • Sistema Oficial de Vendas e Retirada
      </div>

    </div>
  `;

  if(dados.qr_code_retirada){
    new QRCode(document.getElementById("qrcodeRetirada"),{
      text:dados.qr_code_retirada,
      width:240,
      height:240,
      correctLevel:QRCode.CorrectLevel.H
    });
  }
}

/* =========================================
   STATUS
========================================= */
async function verificarPagamento(){

  if(!dados || !dados.payment_id){
    renderPendente();
    return;
  }

  try{

    const res = await fetch(
      `https://fpss-backend.onrender.com/verificar-pagamento/${dados.payment_id}`
    );

    const resultado = await res.json();

    const statusBox = document.getElementById("statusPagamento");

if(resultado.sucesso && resultado.status_interno === "pago"){

  dados.token_retirada =
    resultado.token_retirada || dados.token_retirada;

  dados.qr_code_retirada =
    resultado.qr_code_retirada || dados.qr_code_retirada;

  localStorage.setItem("pixData", JSON.stringify(dados));

  statusBox.innerHTML = "✅ Pagamento aprovado! Retirada liberada.";
  statusBox.style.background = "#d4edda";
  statusBox.style.color = "#155724";

  renderPago();

} else {

      statusBox.innerHTML = "⏳ Aguardando confirmação do pagamento...";
      statusBox.style.background = "#fff3cd";
      statusBox.style.color = "#856404";

      renderPendente();
    }

  } catch {

    renderPendente();
  }
}

if(!dados){
  document.body.innerHTML = "<h2 style='color:white'>❌ Nenhum pedido encontrado.</h2>";
} else {
  verificarPagamento();
  setInterval(verificarPagamento,15000);
}
</script>

</body>
</html>
